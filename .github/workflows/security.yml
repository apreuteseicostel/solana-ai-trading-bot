name: Security hygiene
on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pip-audit>=2.7,<3'
      - run: python -m pip install -e .
      - run: pip-audit
